</style><header><h1>AgentAI screen designs</h1><p class="muted">Design artifact · synthetic examples · owner-selected price and proposed operational defaults</p></header><div class="layout"><nav aria-label="Screen designs" id="nav"></nav><main id="main"></main></div><footer>Every screen needs loading, empty, error, offline and permission states. Product APIs remain disabled in the Phase 2 foundation.</footer><script>
const screens=[["Sign-in & recovery", "Continue with your verified identity", "Recovery links expire; account existence stays private.", "Continue", "invalid/expired \u00b7 rate-limited"], ["Agent setup", "Your private agent is being prepared", "Retry resumes the same deployment operation.", "Check setup", "pending \u00b7 capacity unavailable \u00b7 failed"], ["Overview", "Reading List task is running", "Show last observed time; unknown cost stays unknown.", "View work", "stale \u00b7 offline \u00b7 no tasks"], ["Projects", "Reading List", "10 project limit; IDs are account-scoped on every route.", "New project", "empty \u00b7 quota reached \u00b7 denied"], ["Conversation", "Build my reading-list app", "Submit once; reconnect/history cannot create another run.", "Send request", "budget denied \u00b7 sending \u00b7 unknown submission"], ["Live work", "Research \u2192 build \u2192 verify", "Public progress only. Pause timeline does not pause execution.", "Pause timeline", "reconnecting \u00b7 cursor expired \u00b7 unavailable cancel"], ["Files & results", "reading-list-v1.zip", "Immutable version, SHA-256, task provenance and current download authorization.", "Download version", "partial \u00b7 scan pending \u00b7 expired link"], ["Approvals", "Review a proposed action", "Account/target/payload/expiry exact; denial has no effect.", "Review decision", "expired \u00b7 changed \u00b7 unsupported surface"], ["Memory", "Use concise source summaries", "Confirmed facts with source/date; correction/deletion updates retrieval.", "View preferences", "empty \u00b7 deleting index \u00b7 denied"], ["Schedules", "Available in a later release", "No unattended authority until native approval/budget boundaries pass.", "View release scope", "unavailable \u00b7 timezone error \u00b7 paused"], ["Integrations", "Google / GitHub \u2014 disconnected", "Read-only later release; protected per-account credentials.", "View scopes", "expired \u00b7 refresh failed \u00b7 disconnected"], ["Usage & billing", "Estimate $0.28 \u00b7 reconciled pending", "Owner-selected $79 subscription; $25 included provider cost; no automatic overage.", "View ledger", "late usage \u00b7 payment grace \u00b7 limit reached"], ["Account & Telegram", "Link your Telegram identity", "10min one-time code verified against numeric sender; revoke immediately.", "Create link", "expired \u00b7 already linked \u00b7 account deleting"], ["Internal operations", "Customer deployment health", "Separate operator scope; every action audited and fixed.", "Inspect status", "unavailable \u00b7 stale backup \u00b7 permission denied"]];const nav=document.querySelector('#nav');const main=document.querySelector('#main');function show(i){const s=screens[i];main.replaceChildren();for(const [j,b] of [...nav.children].entries())b.setAttribute('aria-current',j===i?'true':'false');const title=document.createElement('h2');title.textContent=s[0];main.append(title);const state=document.createElement('p');state.className='tag';state.textContent='Example state: '+s[4];main.append(state);const card=document.createElement('section');card.className='card';const h=document.createElement('h3');h.textContent=s[1];card.append(h);const note=document.createElement('p');note.textContent=s[2];card.append(note);const button=document.createElement('button');button.textContent=s[3]+' — design only';button.addEventListener('click',()=>{status.textContent='This is an annotated wireframe. No service action was performed.'});card.append(button);const status=document.createElement('p');status.setAttribute('role','status');card.append(status);main.append(card);const cols=document.createElement('div');cols.className='columns';for(const text of ['Primary region: scoped customer content and actions','Secondary region: timestamps, limits and task provenance']){const item=document.createElement('div');item.className='placeholder';item.textContent=text;cols.append(item)}main.append(cols)}screens.forEach((s,i)=>{const b=document.createElement('button');b.textContent=s[0];b.onclick=()=>show(i);nav.append(b)});show(0);
</script></html>
