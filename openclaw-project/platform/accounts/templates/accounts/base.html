<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>{% block title %}AgentAI{% endblock %}</title><link rel="stylesheet" href="/account/ui/"><!-- Slashed asset path, matching edge forwarding conventions. -->{% block head %}{% endblock %}</head><body>
<header class="topbar">
<a class="wordmark" href="/account/"><svg width="18" height="18" viewBox="0 0 18 18" fill="none" aria-hidden="true"><rect x="1" y="1" width="16" height="16" rx="4.5" stroke="#8bdfcd" stroke-width="1.4"/><path d="M9 4.6L10.55 8.45L14.4 10L10.55 11.55L9 15.4L7.45 11.55L3.6 10L7.45 8.45Z" fill="#8bdfcd"/></svg>AgentAI</a>
<span class="pill">Private beta</span>
<span class="spacer"></span>
{% if nav %}<span class="who">{{ email }}</span><form method="post" action="/auth/logout">{% csrf_token %}<button class="ghost small">Sign out</button></form>{% endif %}
</header>
{% if nav %}<nav class="topnav" aria-label="Account sections">
<a href="/account/" {% if nav_here == 'home' %}aria-current="page"{% endif %}>Overview</a>
<a href="/account/chat/" {% if nav_here == 'chat' %}aria-current="page"{% endif %}>Chat</a>
<a href="/account/requests/" {% if nav_here == 'requests' %}aria-current="page"{% endif %}>Requests</a>
<a href="/account/usage/" {% if nav_here == 'usage' %}aria-current="page"{% endif %}>Usage</a>
<a href="/account/connections/" {% if nav_here == 'connections' %}aria-current="page"{% endif %}>Connections</a>
<a href="/account/billing/" {% if nav_here == 'billing' %}aria-current="page"{% endif %}>Billing</a>
</nav>{% endif %}
<main class="wrap{% if not nav %} narrow{% endif %}">
{% block body %}{% endblock %}
</main>
<footer class="foot">Invitation-only private beta. Agent execution is offline; queued work waits safely.</footer>
</body></html>
