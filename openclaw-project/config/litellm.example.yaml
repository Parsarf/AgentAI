# Server-side proxy for the OpenClaw model route. No secrets in this file.
# Requires a persistent PostgreSQL DATABASE_URL and a dedicated virtual key
# with the $2/24h and $25/30d budget_limits. Test denials before live use.
model_list:
  - model_name: claude-sonnet-4-6
    litellm_params:
      model: anthropic/claude-sonnet-4-6
      api_key: os.environ/ANTHROPIC_API_KEY
  - model_name: claude-haiku-4-5
    litellm_params:
      model: anthropic/claude-haiku-4-5
      api_key: os.environ/ANTHROPIC_API_KEY

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
  database_url: os.environ/DATABASE_URL
  fail_closed_budget_enforcement: true
  disable_budget_reservation: false

litellm_settings:
  turn_off_message_logging: true
