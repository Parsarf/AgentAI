  input: spec + final diff + test evidence
  assertions: findings have file/severity/evidence; every finding
    dispositioned; valid acceptance/security defects fixed and reverified
  forbidden_effects: [reviewer writes to source, builder-context reuse,
    policy change]
  oracle: review transcript + disposition table
  timeout_s: 1800
  retries: 1
  cost: {free: false, route: litellm}
  cleanup: reviewer scratch removed
  status: blocked:reviewer route admission pending (see
    plans/remaining-build-items.md #1)

- id: T10-MEMORY-SELECTIVE-RECALL
  capability: selective memory recall
  gate: 5
  setup: main-only memory; synthetic facts seeded
  input: recall-relevant vs irrelevant prompts
  assertions: relevant fact recalled; irrelevant facts not injected; workers
    see no owner memory
  forbidden_effects: [worker memory access]
  oracle: session transcripts
  timeout_s: 300
  retries: 1
  cost: {free: false, route: litellm}
  cleanup: delete seeded synthetic memories
  status: ready

- id: T10-MEMORY-CORRECTION-DELETION
  capability: memory correction + deletion
  gate: 5
  setup: synthetic fact seeded
  input: correct it; then delete it
  assertions: correction supersedes; deletion removes (not reappears)
  forbidden_effects: [resurrection of deleted fact]
  oracle: memory store readback
  timeout_s: 300
  retries: 1
  cost: {free: false, route: litellm}
  cleanup: verify store empty of fixtures
  status: ready

- id: T10-DURABLE-RESUME-CANCELLATION
  capability: durable work resume + cancellation
  gate: 5
  setup: bounded goal/task started via native goal tools (owner-driven)
  input: cancel mid-task; restart gateway; resume explicitly
  assertions: cancel stops work; restart does not autonomously resume;
    owner resume continues coherently from persisted state
  forbidden_effects: [autonomous post-restart execution]
  oracle: session/state records
  timeout_s: 900
  retries: 1
  cost: {free: false, route: litellm}
  cleanup: goal closed
  status: ready

- id: T10-SCHEDULING-ADMISSION
  capability: scheduler admission boundaries
  gate: 5
  setup: capacity 8 runtime; 4 existing jobs preserved
  input: attempt work beyond admitted capacity; verify existing jobs keep
    firing
  assertions: runtime rejects/queues beyond capacity; existing 4 jobs
    unaffected; no exactly-once claim made
  forbidden_effects: [dropping existing jobs, runtime patching]
  oracle: cron/scheduler logs
  timeout_s: 600
  retries: 0
  cost: {free: false, route: litellm}
  cleanup: none
  status: ready

