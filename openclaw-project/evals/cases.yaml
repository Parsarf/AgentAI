  timeout_s: 60
  retries: 0
  cost: {free: true, route: none}
  cleanup: none
  status: ready

- id: T11-BUDGET-OUTAGE-FALLBACK
  capability: budget stop, provider outage, fallback without duplication
  gate: 9
  setup: local-estimate budget at cap; transport raising 429 / timeout
  input: decide() calls under each failure mode
  assertions: budget_exhausted / rate-limited / provider_error all fall
    back to baseline route; no retry storm; fallback fires only when
    optimized route executed nothing
  forbidden_effects: [duplicate effects, silent route switch to unapproved
    billing]
  oracle: unit harness + trace records
  timeout_s: 60
  retries: 0
  cost: {free: true, route: none}
  cleanup: none
  status: ready

- id: T11-CONFIDENCE-CALIBRATION
  capability: threshold calibration on own data
  gate: 9
  setup: TypeSafe account + credential (owner decision); dev fixture set
  input: dev-scenario decision traces with logged model + probabilities
  assertions: provisional thresholds replaced by measured ones; results
    recorded per pinned model version; thresholds never grant permissions
  forbidden_effects: [tuning on held-out set, treating confidence as
    approval]
  oracle: calibration report + updated config readback
  timeout_s: 3600
  retries: 1
  cost: {free: false, route: typesafe}
  cleanup: none
  status: blocked:no TypeSafe account or credential exists; owner decision
    pending (separate billing, data-handling choice)

- id: T11-PAIRED-COMPARISON
  capability: paired baseline-vs-optimized reliability/cost/latency
  gate: 9
  setup: frozen held-out fixtures; baseline = existing browser-worker route
  input: whole-task paired runs with usage accounting and trace correlation
  assertions: whole-task success parity or better; cost/latency deltas
    reported with observation counts; failures include malformed-response
    and escalation traces
  forbidden_effects: [running without Phase 11 owner authorization,
    tuning to held-out set, unapproved billing route]
  oracle: compare_runner trace records + task readbacks
  timeout_s: 7200
  retries: 1
  cost: {free: false, route: typesafe+litellm}
  cleanup: dispose sessions; stop preview servers
  status: blocked:requires T11-CONFIDENCE-CALIBRATION prerequisites
    (account, credential, transport) plus Phase 11 owner authorization


