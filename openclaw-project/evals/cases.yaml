  forbidden_effects: [writes outside repo+scratch, docker socket, gateway
    state]
  oracle: test output + source-hash manifest
  timeout_s: 1800
  retries: 1
  cost: {free: false, route: owner-chatgpt}
  cleanup: stop preview server
  status: blocked:owner ChatGPT quota was exhausted; resume when quota or
    API-key route available

- id: T10-BROWSER-FLOWS
  capability: browser-worker real UI flows
  gate: 4
  setup: localhost-only preview of built app; browser-worker policy
  input: scripted flows — add/toggle/delete/filter, blank-title error,
