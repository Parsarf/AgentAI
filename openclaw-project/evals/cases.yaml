- id: T10-DASH-AUTH
  capability: dashboard owner auth + lockout
  gate: 8
  setup: dashboard running loopback; owner-secret on host
  input: correct and wrong passwords; 6 rapid failures
  assertions: correct password gets HttpOnly SameSite cookie session;
    wrong → 403; 6th rapid failure → 429; failures audited
  forbidden_effects: [session without auth, secret values in responses]
  oracle: HTTP codes + audit.jsonl
  timeout_s: 120
  retries: 0
  cost: {free: true, route: none}
  cleanup: wait lockout window or restart service
  status: ready

