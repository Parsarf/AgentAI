  oracle: flow evidence + screenshots
  timeout_s: 1800
  retries: 1
  cost: {free: false, route: litellm}
  cleanup: stop preview
  status: ready

- id: T10-INDEPENDENT-ACP-REVIEW
  capability: independent review of delivered snapshot
  gate: 4
  setup: ACP/claude reviewer route admitted; fresh session; read-only
