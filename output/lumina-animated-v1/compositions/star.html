<template>

<script>

 const sample=document.createElement('canvas');sample.width=240;sample.height=240;const sc=sample.getContext('2d');sc.drawImage(source,0,0,240,240);const pix=sc.getImageData(0,0,240,240).data;
 const pool=[];for(let y=35;y<205;y++)for(let x=35;x<205;x++){let i=(y*240+x)*4;if(pix[i+2]>47&&pix[i+2]>pix[i]*1.7&&pix[i+2]>pix[i+1]*1.65)pool.push({x:x*3,y:y*3,r:pix[i],g:pix[i+1],blue:pix[i+2]});}

 }
