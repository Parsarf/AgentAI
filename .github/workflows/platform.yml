name: Lumina CI
# The checks are openclaw-project/ci/run.sh, in parts that run in parallel. The same script runs them all on a developer's machine (`ci/run.sh all`), so there is one
# definition of "green". A pull request runs them once. The push to main that merges it does not run them again when the merged files are identical to what the pull
# request already tested (ci/already-tested.sh): the deploy then starts at once. A branch push by itself runs nothing: open a pull request.
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
  actions: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      tested: ${{ steps.same.outputs.tested }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - id: same
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash openclaw-project/ci/already-tested.sh | tee -a "$GITHUB_OUTPUT"

  platform:
    needs: gate
    if: needs.gate.outputs.tested != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        part: ['accounts 1 3', 'accounts 2 3', 'accounts 3 3', 'platform 1 2', 'platform 2 2', 'acceptance', 'extras']
    name: ${{ matrix.part }}
    defaults:
      run:
        shell: bash
        working-directory: openclaw-project/platform
    env:
      AGENTAI_PUBLIC_ORIGIN: https://localhost
      BROWSE_CHROME: /usr/bin/google-chrome
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: openclaw-project/platform/requirements.lock
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: sudo apt-get install -y age
      - run: python -m pip install --require-hashes -r requirements.lock
      - name: Browser fixture dependencies
        run: |
          test -x "$BROWSE_CHROME"
          npm ci --prefix ../browse
      - run: bash ../ci/run.sh ${{ matrix.part }}

  lumina:
    needs: gate
    if: needs.gate.outputs.tested != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: openclaw-project/lumina/package-lock.json
      - run: bash openclaw-project/ci/run.sh lumina

  # Report-only: these say what they find and never block a merge.
  report:
    needs: gate
    if: needs.gate.outputs.tested != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        part: [report, browse]
    name: ${{ matrix.part }} (report only)
    env:
      AGENTAI_PUBLIC_ORIGIN: https://localhost
      BROWSE_CHROME: /usr/bin/google-chrome
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: openclaw-project/platform/requirements.lock
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: sudo apt-get install -y age && python -m pip install --require-hashes -r openclaw-project/platform/requirements.lock && npm ci --prefix openclaw-project/browse
      - run: bash openclaw-project/ci/run.sh ${{ matrix.part }}
